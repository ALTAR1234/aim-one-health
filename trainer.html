(() => {
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const title = (c) => c.toLowerCase().replace(/(^|[\s&,/-]+)(\w)/g, (m) => m.toUpperCase()).replace(/\bGi\b/, 'GI').replace(/\bGu\b/, 'GU').replace(/\bCns\b/, 'CNS');
const page = new URLSearchParams(location.search).get('t') || 'gbm';
const app = document.getElementById('app');
function evaluate(expr, vals) {
if (!expr) return true;
const toks = String(expr).match(/\s*(\|\||&&|==|!=|<=|>=|<|>|\(|\)|'[^']*'|"[^"]*"|-?\d+(?:\.\d+)?|[A-Za-z_][\w.]*)\s*/g);
if (!toks || toks.join('').replace(/\s/g, '') !== String(expr).replace(/\s/g, '')) return null;
const t = toks.map((x) => x.trim());
let i = 0;
const peek = () => t[i], next = () => t[i++];
const value = () => {
const x = next();
if (x === '(') { const v = or(); next(); return { v }; }
if (x === 'true' || x === 'false') return { v: x === 'true' };
if (/^['"]/.test(x)) return { lit: x.slice(1, -1) };
if (/^-?\d/.test(x)) return { lit: Number(x) };
return { ref: x };
};
const cmp = () => {
const a = value();
if (['==', '!=', '<', '<=', '>', '>='].includes(peek())) {
const op = next(), b = value();
const get = (o) => (o.ref !== undefined ? (o.ref in vals ? vals[o.ref] : undefined) : o.lit);
const x = get(a), y = get(b);
if (x === undefined || y === undefined) return null;
const n = (q) => (typeof q === 'number' ? q : isNaN(Number(q)) ? q : Number(q));
switch (op) {
case '==': return String(x) === String(y);
case '!=': return String(x) !== String(y);
case '<': return n(x) < n(y);
case '<=': return n(x) <= n(y);
case '>': return n(x) > n(y);
case '>=': return n(x) >= n(y);
}
}
if (a.v !== undefined) return a.v;
if (a.ref !== undefined) return a.ref in vals ? Boolean(vals[a.ref]) : null;
return Boolean(a.lit);
};
const and = () => { let r = cmp(); while (peek() === '&&') { next(); const b = cmp(); r = r === false || b === false ? false : r === null || b === null ? null : true; } return r; };
const or = () => { let r = and(); while (peek() === '||') { next(); const b = and(); r = r === true || b === true ? true : r === null || b === null ? null : false; } return r; };
try { const r = or(); return i === t.length ? r : null; } catch { return null; }
}
fetch(`trainers/${encodeURIComponent(page)}.json`).then((r) => { if (!r.ok) throw new Error(); return r.json(); }).then(render).catch(() => {
document.getElementById('loading').innerHTML = 'This trainer could not be loaded. <a href="navigator.html">Back to the Navigator</a>';
});
function render(d) {
const nav = `${d.specialty || 'Oncology'} Navigator`;
document.title = `${d.name} · ${nav} · AiM One Health`;
const groups = Object.entries(d.inputs).filter(([, l]) => l.length);
const vals = {};
groups.forEach(([, l]) => l.forEach((f) => { vals[f.id] = f.def ?? (f.options ? f.options[0] : f.min ?? null); }));
const settings = Object.keys(d.arms);
let step = 0, setting = settings[0];
const pretty = (s) => String(s).replace(/_/g, ' ');
const todo = Array.isArray(d.todo) && d.todo.length ? d.todo
: d.milestones.map((m) => ({ title: m.title, timing: m.window || '', details: m.trigger || '', how: m.review || [], howLabel: 'What the team reviews' }));
const short = (s, n) => (String(s).length > n ? String(s).slice(0, n).replace(/\s+\S*$/, '') + '…' : String(s));
app.innerHTML = `
<section class="t-hero"><div class="wrap">
<nav class="crumbs" aria-label="Breadcrumb"><a href="navigator.html">${esc(nav)}</a><span>›</span><span>${esc(title(d.category))}</span></nav>

<div>
<h1>${esc(d.name)}</h1>
<p class="t-theme">${esc(d.theme)}</p>
<p class="t-line"><span class="ok-dot"></span>Quality gate passed · ${d.props} properties · ${esc(d.meta.version)} · verified ${esc(d.meta.verified)}</p>
<p class="t-disc">${esc(d.meta.disclaimer || 'Synthetic patient. Training only. Not medical advice.')}</p>
</div>
<div class="t-actions">
<div class="viewsw" role="tablist" aria-label="View"><button class="on" data-view="clin" role="tab">Clinician</button><button data-view="pat" role="tab">Patient &amp; caregiver</button></div>
<div style="display:flex;gap:8px;flex-wrap:wrap">${d.specialty ? '' : `<a class="btn primary sm inline" href="https://nav.onconavigator.ai/${esc(d.page)}.html">Open live trainer ↗</a>`}<button class="btn ghost sm inline" id="print">Print</button></div>
</div>
</div>
</div></section>
<div class="wrap">
<nav class="t-nav glass strong" id="tnav" role="tablist" aria-label="Trainer sections">
<a href="#overview" class="on" role="tab">Overview</a><a href="#case" role="tab">Your case</a><a href="#options" role="tab">Options <span class="n">${Object.values(d.arms).flat().length}</span></a><a href="#road" role="tab">The road ahead</a><a href="#todo" role="tab">To-do <span class="n">${todo.length}</span></a><a href="#trials" role="tab">Trials <span class="n">${d.trials.length}</span></a><a href="#library" role="tab">Sources <span class="n">${d.refs.length}</span></a>
</nav>
<section class="t-sec" id="overview">
<p class="lead read">${esc(d.meta.summary || '')}</p>
<p class="small muted" style="margin-top:12px">${esc(d.meta.condition || '')}${d.meta.classification ? ` · Classified by ${esc(short(d.meta.classification, 90))}` : ''}${d.meta.response ? ` · Response by ${esc(short(d.meta.response, 90))}` : ''}</p>
${d.stages.length ? `<h3 class="t-h3">The decision journey</h3><ol class="journey-list">${d.stages.map((s) => `<li><b>${esc(s.label)}</b><span>${esc(s.question)}</span></li>`).join('')}</ol>` : ''}
<div class="more-group">
${d.meta.population && d.meta.population.length > 140 ? `<details class="more"><summary>Who this trainer covers</summary><p class="small muted">${esc(d.meta.population)}</p></details>` : ''}
<details class="more"><summary>Rules this trainer never breaks (${d.honesty.length + d.gates.length})</summary>
<div class="lists"><div><h4>Honesty rules</h4><ol>${d.honesty.map((h) => `<li>${esc(h)}</li>`).join('')}</ol></div><div><h4>Safety gates</h4><ul>${d.gates.map((g) => `<li>${esc(g)}</li>`).join('')}</ul>${d.care.length ? `<h4 style="margin-top:18px">Where care has to happen</h4><ul>${d.care.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}</div></div>
</details>
</div>
<div class="t-next"><button class="btn primary inline" data-go="case">Describe the case <span class="arrow">→</span></button></div>
</section>
<section class="t-sec" id="case" hidden>
<p class="muted read" style="margin-bottom:18px">Step through the details. Each option shows whether it fits the case, using the trainer's own eligibility rules.</p>
<div class="wizard">
<div class="steps" id="steps">${groups.map(([g], i) => `<button data-s="${i}"><i>${i + 1}</i>${esc(g)}</button>`).join('')}</div>
<div class="step-panel glass bloom" id="panel"></div>
</div>
</section>
<section class="t-sec" id="options" hidden>
<p class="muted read clin-only" style="margin-bottom:16px">${d.specialty ? 'Sorted by whether they fit the case you entered under Your case.' : 'The live trainer ranks these for the case. Here they&#39;re sorted by whether they fit what you entered.'}</p>
<p class="muted read pat-only" style="margin-bottom:16px">Paths a care team might discuss. “Fits” means the details you entered meet that option's basic requirements. It is not a recommendation.</p>
${settings.length > 1 ? `<div class="tabs2 chips" id="settings">${settings.map((s) => `<button class="chip${s === setting ? ' on' : ''}" data-set="${esc(s)}">${esc(s)} <span class="n">${d.arms[s].length}</span></button>`).join('')}</div>` : ''}
<div class="opts" id="opts"></div>
</section>
<section class="t-sec ms" id="road" hidden>
<div class="thread">${d.milestones.map((m, i) => `<div class="step"><span class="num">${i + 1}</span><div class="card glass"><span class="when">${esc(m.window || m.id)}</span><h3>${esc(m.title)}</h3>${m.trigger ? `<p>${esc(m.trigger)}</p>` : ''}${m.review.length ? `<details class="more"><summary>What the team reviews</summary><ul>${m.review.map((r) => `<li>${esc(r)}</li>`).join('')}</ul></details>` : ''}</div></div>`).join('') || '<p class="muted">No milestones in this trainer.</p>'}</div>
${d.surveillance.length ? `<h3 class="t-h3">Follow-up schedule</h3><dl class="kv kv-wide">${d.surveillance.map((s) => `<dt>${esc(s.phase)}</dt><dd>${esc(s.cadence)}</dd>`).join('')}</dl>` : ''}
</section>
<section class="t-sec" id="todo" hidden>
<div class="todo-top">
<p class="muted read">${d.todo ? 'Step by step: what to do, when, how to do it, and what not to do. Tick steps off as you go; your ticks stay on this device.' : 'The key steps from this guide&#39;s road ahead, in order. A fuller to-do list with how-tos and what not to do is being written for this guide.'}</p>
<div class="todo-prog" aria-live="polite"><div class="bar"><i id="todoBar"></i></div><span id="todoCount"></span></div>
</div>
<div class="todo-alerts glass" id="todoAlerts"></div>
<ol class="todo" id="todoList"></ol>
<p class="small muted" style="margin-top:18px">Teaching guide, not medical advice. Your own care team decides what's right for you.</p>
</section>
<section class="t-sec" id="trials" hidden>
<div class="trial-list">${d.trials.map((t) => `<div class="trial-row"><div><b>${esc(t.name)}</b><span class="small muted">${[t.phase ? 'Phase ' + esc(t.phase) : '', t.setting ? esc(pretty(t.setting)) : ''].filter(Boolean).join(' · ')}</span></div><span class="fit ${t.closed ? 'no' : 'yes'}">${t.closed ? 'Closed' : esc(short(t.status || 'Open', 24))}</span>${t.nct ? `<a href="https://clinicaltrials.gov/study/${esc(t.nct)}">${esc(t.nct)} ↗</a>` : '<span></span>'}</div>`).join('') || '<p class="muted">No trials listed.</p>'}</div>
</section>
<section class="t-sec" id="library" hidden>
<div class="lib-tools"><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input class="input" id="libq" placeholder="Search ${d.refs.length} sources" aria-label="Search sources"></label><div class="chips" id="libg"></div></div>
<div class="lib" id="lib"></div>
</section>
</div>`;
document.querySelectorAll('#app [data-ico]').forEach((el) => (el.innerHTML = window.aimIcon(el.dataset.ico)));
document.getElementById('loading').hidden = true;
app.hidden = false;
app.querySelectorAll('.viewsw button').forEach((b) => (b.onclick = () => {
app.querySelectorAll('.viewsw button').forEach((x) => x.classList.toggle('on', x === b));
document.body.classList.toggle('patient-view', b.dataset.view === 'pat');
drawStep();
}));
const panel = document.getElementById('panel');
const drawStep = () => {
const [g, fields] = groups[step];
app.querySelectorAll('#steps button').forEach((b, i) => b.classList.toggle('on', i === step));
const pat = document.body.classList.contains('patient-view');
panel.innerHTML = `<span class="tiny">Step ${step + 1} of ${groups.length}</span><h3>${esc(g)}</h3>
<div class="t-fields">${fields.map((f) => {
const help = pat ? f.helpPatient || f.help : f.help;
const lbl = esc(f.label.replace(/^\w/, (c) => c.toUpperCase()));
if (f.type === 'range' || f.control === 'slider') return `<div class="fq"><label class="lbl" for="f-${f.id}">${lbl}<output>${esc(vals[f.id])}${f.unit ? ' ' + esc(f.unit) : ''}</output></label><input type="range" id="f-${f.id}" data-f="${f.id}" min="${f.min ?? 0}" max="${f.max ?? 100}" value="${esc(vals[f.id])}">${help ? `<p class="help">${esc(help)}</p>` : ''}</div>`;
if (f.options && f.options.length > 6) return `<div class="fq"><label class="lbl" for="f-${f.id}">${lbl}</label><select class="input" id="f-${f.id}" data-f="${f.id}">${f.options.map((o) => `<option${String(vals[f.id]) === o ? ' selected' : ''} value="${esc(o)}">${esc(pretty(o))}</option>`).join('')}</select>${help ? `<p class="help">${esc(help)}</p>` : ''}</div>`;
if (f.options) return `<div class="fq"><span class="lbl" style="display:block;font:600 15.5px/1.3 var(--font-body)">${lbl}</span><div class="seg" role="radiogroup">${f.options.map((o) => `<button role="radio" aria-checked="${String(vals[f.id]) === o}" class="${String(vals[f.id]) === o ? 'on' : ''}" data-f="${f.id}" data-v="${esc(o)}">${esc(pretty(o))}</button>`).join('')}</div>${help ? `<p class="help">${esc(help)}</p>` : ''}</div>`;
return `<div class="fq"><span class="lbl" style="display:block;font:600 15.5px/1.3 var(--font-body)">${lbl}</span><div class="seg">${['no', 'yes'].map((o) => `<button class="${String(vals[f.id]) === o || (o === 'yes' && vals[f.id] === true) ? 'on' : ''}" data-f="${f.id}" data-v="${o}">${o}</button>`).join('')}</div>${help ? `<p class="help">${esc(help)}</p>` : ''}</div>`;
}).join('')}</div>
<div class="step-foot"><button class="btn ghost sm inline" id="prev"${step === 0 ? ' disabled' : ''}>← Back</button><button class="btn primary sm inline" id="nextb">${step === groups.length - 1 ? 'See the options ↓' : 'Next section →'}</button></div>`;
panel.querySelectorAll('input[type=range]').forEach((r) => (r.oninput = () => {
vals[r.dataset.f] = Number(r.value);
const f = fields.find((x) => x.id === r.dataset.f);
r.previousElementSibling.querySelector('output').textContent = r.value + (f?.unit ? ' ' + f.unit : '');
drawOpts();
}));
panel.querySelectorAll('select[data-f]').forEach((s) => (s.onchange = () => { vals[s.dataset.f] = s.value; drawOpts(); }));
panel.querySelectorAll('.seg button').forEach((b) => (b.onclick = () => { vals[b.dataset.f] = b.dataset.v; b.parentElement.querySelectorAll('button').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', String(x === b)); }); drawOpts(); }));
document.getElementById('prev').onclick = () => { step = Math.max(0, step - 1); drawStep(); };
document.getElementById('nextb').onclick = () => { if (step < groups.length - 1) { step++; drawStep(); } else showTab('options'); };
};
app.querySelectorAll('#steps button').forEach((b) => (b.onclick = () => { step = Number(b.dataset.s); drawStep(); }));
const drawOpts = () => {
const list = d.arms[setting].map((a) => ({ a, fit: evaluate(a.eligibility, vals) }));
list.sort((x, y) => (y.fit === true) - (x.fit === true) || (x.fit === false) - (y.fit === false));
document.getElementById('opts').innerHTML = list.map(({ a, fit }) => `
<article class="opt glass${fit === false ? ' no' : ''}">
<div class="head"><h3>${esc(a.name)}</h3><span class="fit ${fit === true ? 'yes' : fit === false ? 'no' : 'maybe'}">${fit === true ? 'Fits' : fit === false ? "Doesn't fit" : 'Depends'}</span></div>
<p class="opt-line">${a.intent ? `<span>${esc(pretty(a.intent))}</span>` : ''}${a.burden != null ? `<span>Burden <span class="burden" aria-label="Burden ${a.burden} of 5">${[1, 2, 3, 4, 5].map((n) => `<i class="${n <= a.burden ? 'on' : ''}"></i>`).join('')}</span></span>` : ''}</p>
${a.patient ? `<p class="small muted pat-only">${esc(a.patient)}</p>` : ''}
<details class="more"><summary>Details</summary>
<dl class="kv">
${a.guideline ? `<dt>Guideline</dt><dd>${esc(a.guideline)}</dd>` : ''}
${a.evidence ? `<dt>Evidence</dt><dd>${esc(a.evidence)}</dd>` : ''}
${a.toxicity ? `<dt>Side effects</dt><dd>${esc(a.toxicity)}</dd>` : ''}
${a.outcome && a.outcome.value != null ? `<dt>${esc(pretty(a.outcome.type || 'outcome'))}</dt><dd>${esc(a.outcome.value)} <span class="tiny">· teaching model</span></dd>` : ''}
${a.drugs.length ? `<dt>Treatments</dt><dd>${a.drugs.map((x) => esc(x)).join(', ')}</dd>` : ''}
${a.eligibility && a.eligibility !== 'true' ? `<dt>Requires</dt><dd class="rule">${esc(a.eligibility)}</dd>` : ''}
</dl>
</details>
</article>`).join('');
};
const st = document.getElementById('settings');
if (st) st.onclick = (e) => { const b = e.target.closest('[data-set]'); if (!b) return; setting = b.dataset.set; st.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === b)); drawOpts(); };
const todoKey = 'aim.todo.' + d.page;
let done = {};
try { done = JSON.parse(localStorage.getItem(todoKey) || '{}') || {}; } catch {}
const AL = window.aimAlerts;
let alerts = AL.load(d.page), editing = -1, draft = [];
const BELL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>';
const isDesk = Boolean(window.aimDesk?.alerts);
const ensureStart = () => { let s = AL.startDate(d.page); if (!s) { s = AL.ymd(new Date()); AL.setStartDate(d.page, s); } return s; };
const bell = (t, i) => {
const list = alerts[i] || [];
if (!list.length) return `<button type="button" class="todo-bell" data-bell="${i}">${BELL}Remind me</button>`;
const soon = list.map((a) => ({ a, n: AL.next(a) })).filter((x) => x.n).sort((x, y) => x.n - y.n)[0];
const text = soon ? esc(AL.fmt(soon.n)) + (soon.a.repeat !== 'none' ? ' · ' + esc(AL.repeatLabel(soon.a.repeat).toLowerCase()) : '') : 'Reminders passed';
return `<button type="button" class="todo-bell on" data-bell="${i}" title="Change reminders">${BELL}${text}${list.length > 1 ? ` <span class="more">+${list.length - 1}</span>` : ''}</button>`;
};
const row = (a, k) => `<div class="todo-alert-item" data-k="${k}">
${a.label ? `<p class="todo-alert-label">${esc(a.label)}</p>` : ''}
<div class="todo-alert-row">
<label>Date<input class="input" type="date" name="date" value="${esc(a.date)}"></label>
<label>Time<input class="input" type="time" name="time" value="${esc(a.time)}"></label>
<label>Repeats<select class="input" name="repeat">${AL.REPEATS.map(([v, l]) => `<option value="${v}"${v === a.repeat ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
<button type="button" class="todo-alert-x" data-act="del" aria-label="Remove this reminder" title="Remove this reminder">✕</button>
</div>
</div>`;
const editor = (t, i) => `<div class="todo-alert" data-ed="${i}">
<h4>Reminders for this step</h4>
${draft.map(row).join('') || '<p class="small muted">No reminders yet.</p>'}
<div class="todo-alert-btns">
<button type="button" class="btn primary sm inline" data-act="save">Save</button>
<button type="button" class="btn ghost sm inline" data-act="add">+ Add a reminder</button>
${(t.alerts || []).length ? `<button type="button" class="btn ghost sm inline" data-act="suggest">Use the suggested ones (${t.alerts.length})</button>` : ''}
<button type="button" class="btn ghost sm inline" data-act="cal">Add to calendar</button>
<button type="button" class="btn ghost sm inline" data-act="cancel">Cancel</button>
</div>
${(t.alerts || []).length ? '<p class="small muted" style="margin:10px 0 0">Suggested timings follow the guide\'s sources where they give one; times of day are only suggestions.</p>' : ''}
</div>`;
const flat = (only) => Object.entries(alerts).filter(([i]) => only == null || Number(i) === only)
.flatMap(([i, list]) => list.map((a, k) => ({ page: d.page, i: Number(i), k, title: todo[i]?.title || 'To-do step', ...a })));
const persist = () => { AL.save(d.page, d.name, alerts, todo); };
const optional = (t) => /^only if/i.test(t.phase || '');
const drawAlertBar = () => {
const n = flat().length, sugg = todo.filter((t) => (t.alerts || []).length && !optional(t)).length;
document.getElementById('todoAlerts').innerHTML = `
<span class="todo-alerts-ico">${BELL}</span>
<p><b>${n ? `${n} reminder${n > 1 ? 's' : ''} set` : 'Reminders'}</b><span>${isDesk ? 'This app pops up a notification when one is due (keep it open or in the tray). ' : ''}Add them to your phone's calendar and your phone and Apple Watch or Android watch will alert you too.</span></p>
<div class="todo-alerts-btns">
${sugg ? `<button type="button" class="btn ghost sm inline" id="alSuggest">Set all suggested reminders</button>` : ''}
${n ? '<button type="button" class="btn ghost sm inline" id="alClear">Clear all</button>' : ''}
<button type="button" class="btn primary sm inline" id="alCal"${n ? '' : ' disabled'}>Add all to calendar</button>
</div>`;
document.getElementById('alCal').onclick = () => AL.download(AL.ics(flat(), d.name), `${d.page}-reminders.ics`);
const sb = document.getElementById('alSuggest');
if (sb) sb.onclick = () => {
const start = ensureStart();
todo.forEach((t, i) => { if ((t.alerts || []).length && !optional(t) && !(alerts[i] || []).length) alerts[i] = AL.suggestAll(t, start); });
persist(); drawTodo();
};
const cb = document.getElementById('alClear');
if (cb) cb.onclick = () => { if (!confirm('Remove all reminders for this guide?')) return; alerts = {}; persist(); drawTodo(); };
};
const readDraft = (box) => box.querySelectorAll('.todo-alert-item').forEach((el) => {
const a = draft[Number(el.dataset.k)]; if (!a) return;
a.date = el.querySelector('[name=date]').value; a.time = el.querySelector('[name=time]').value; a.repeat = el.querySelector('[name=repeat]').value;
});
document.getElementById('todoList').addEventListener('click', (e) => {
const b = e.target.closest('[data-bell]');
if (b) {
const i = Number(b.dataset.bell);
if (editing === i) { editing = -1; } else {
editing = i;
draft = (alerts[i] || []).map((a) => ({ ...a }));
if (!draft.length) draft = (todo[i].alerts || []).length ? AL.suggestAll(todo[i], AL.startDate(d.page)) : [AL.suggest(todo[i], null)];
}
drawTodo(); return;
}
const act = e.target.closest('[data-act]'); if (!act) return;
const box = act.closest('[data-ed]'), i = Number(box.dataset.ed);
readDraft(box);
const ok = draft.filter((a) => a.date && a.time);
switch (act.dataset.act) {
case 'add': draft.push(AL.suggest({}, null)); break;
case 'del': draft.splice(Number(act.closest('[data-k]').dataset.k), 1); break;
case 'suggest': draft = AL.suggestAll(todo[i], ensureStart()); break;
case 'cal': if (ok.length) AL.download(AL.ics(ok.map((a, k) => ({ page: d.page, i, k, title: todo[i].title, ...a })), d.name), `${d.page}-step-${i + 1}.ics`); return;
case 'save': if (ok.length) { alerts[i] = ok; ensureStart(); } else delete alerts[i]; persist(); editing = -1; break;
case 'cancel': editing = -1; break;
}
drawTodo();
});
const drawTodo = () => {
drawAlertBar();
const n = todo.filter((_, i) => done[i]).length;
document.getElementById('todoBar').style.width = (todo.length ? (n / todo.length) * 100 : 0) + '%';
document.getElementById('todoCount').textContent = `${n} of ${todo.length} done`;
const srcs = (t) => (t.refs || []).filter((r) => d.refs[r - 1]);
const phaseHead = (t, i) => (t.phase && t.phase !== todo[i - 1]?.phase
? `<li class="todo-phase"><h3>${esc(t.phase)}</h3>${optional(t) ? '<p>Skip any that don&#39;t apply to you. These aren&#39;t included in “Set all suggested reminders”.</p>' : ''}</li>` : '');
document.getElementById('todoList').innerHTML = todo.map((t, i) => `${phaseHead(t, i)}
<li class="todo-step glass${done[i] ? ' done' : ''}">
<label class="todo-check"><input type="checkbox" data-i="${i}"${done[i] ? ' checked' : ''} aria-label="Mark step ${i + 1} done"><i></i></label>
<div class="todo-body">
<div class="todo-head"><span class="num">${i + 1}</span><h3>${esc(t.title)}</h3></div>
${t.summary ? `<p class="todo-sum">${esc(t.summary)}</p>` : ''}
<p class="todo-meta">${t.timing ? `<span class="when">⏱ ${esc(t.timing)}</span>` : ''}${t.who ? `<span>${esc(t.who)}</span>` : ''}${bell(t, i)}</p>
${editing === i ? editor(t, i) : ''}
${(t.how || []).length || (t.avoid || []).length || t.details ? `<details class="more"${i === 0 && !done[i] ? ' open' : ''}><summary>${t.howLabel ? 'Details' : 'How to do it'}</summary>
<div class="todo-cols">
${(t.how || []).length ? `<div class="todo-do"><h4>${esc(t.howLabel || 'Do')}</h4><ol>${t.how.map((h) => `<li>${esc(h)}</li>`).join('')}</ol></div>` : ''}
${(t.avoid || []).length ? `<div class="todo-dont"><h4>Don't</h4><ul>${t.avoid.map((h) => `<li>${esc(h)}</li>`).join('')}</ul></div>` : ''}
</div>
${t.details ? `<div class="todo-info"><h4>Good to know</h4><p>${esc(t.details)}</p></div>` : ''}
${srcs(t).length ? `<p class="todo-src">Sources ${srcs(t).map((r) => `<a href="${esc(d.refs[r - 1].url)}" title="${esc(d.refs[r - 1].label)}">${r}</a>`).join('')}</p>` : ''}
</details>` : ''}
</div>
</li>`).join('') || '<p class="muted">No steps in this guide yet.</p>';
};
document.getElementById('todoList').onchange = (e) => {
const i = e.target.dataset.i; if (i == null) return;
if (e.target.checked) done[i] = 1; else delete done[i];
try { localStorage.setItem(todoKey, JSON.stringify(done)); } catch {}
drawTodo();
};
const libGroups = ['All', ...new Set(d.refs.map((r) => r.group).filter(Boolean))];
let lg = 'All';
const libg = document.getElementById('libg');
libg.innerHTML = libGroups.map((g) => `<button class="chip${g === 'All' ? ' on' : ''}" data-g="${esc(g)}">${esc(pretty(g))}</button>`).join('');
const drawLib = () => {
const q = document.getElementById('libq').value.trim().toLowerCase();
const list = d.refs.filter((r) => (lg === 'All' || r.group === lg) && (!q || `${r.label} ${r.src}`.toLowerCase().includes(q)));
document.getElementById('lib').innerHTML = list.map((r) => `<a href="${esc(r.url)}"><span>${esc(r.src || r.group || '')}</span>${esc(r.label)}</a>`).join('') || '<p class="muted">No sources match.</p>';
};
libg.onclick = (e) => { const b = e.target.closest('[data-g]'); if (!b) return; lg = b.dataset.g; libg.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === b)); drawLib(); };
document.getElementById('libq').oninput = drawLib;
document.getElementById('print').onclick = () => print();
const navLinks = [...document.querySelectorAll('#tnav a')];
function showTab(id) {
document.querySelectorAll('.t-sec[id]').forEach((s) => (s.hidden = s.id !== id));
navLinks.forEach((a) => { const on = a.getAttribute('href') === '#' + id; a.classList.toggle('on', on); a.setAttribute('aria-selected', String(on)); });
history.replaceState(null, '', '#' + id);
const nav = document.getElementById('tnav');
if (nav.getBoundingClientRect().top < 0 || scrollY > nav.offsetTop) scrollTo({ top: nav.offsetTop - 100, behavior: 'smooth' });
}
navLinks.forEach((a) => (a.onclick = (e) => { e.preventDefault(); showTab(a.getAttribute('href').slice(1)); }));
app.querySelectorAll('[data-go]').forEach((b) => (b.onclick = () => showTab(b.dataset.go)));
const startTab = location.hash.slice(1);
if (startTab && document.getElementById(startTab)?.classList.contains('t-sec')) showTab(startTab);
drawStep();
drawOpts();
drawLib();
drawTodo();
window.aimAsk?.attach({ data: d, getCase: () => ({ ...vals }), getSetting: () => setting,
getView: () => (app.querySelector('.viewsw button.on')?.dataset.view === 'pat' ? 'pat' : 'clin') });
}
})();
</script>
</body>
